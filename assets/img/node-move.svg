<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">노드를 두 스케줄러 사이에서 옮기는 절차</title><desc id="d">Slurm에서 Kubernetes로 옮길 때는 새 작업을 막고 돌던 작업이 끝나기를 기다린 뒤 넘긴다. 반대 방향도 파드를 비운 뒤 넘긴다. 기다리는 단계를 건너뛰면 실행 중인 작업이 죽는다.</desc><rect width="900" height="300" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">노드 한 대를 옮기는 절차</text><rect x="24" y="70" width="152" height="64" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="100.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">Slurm 보유</text><text x="100.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">작업이 돌고 있다</text><line x1="178" y1="102" x2="222" y2="102" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="226" y="70" width="152" height="64" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="302.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">새 작업 차단</text><text x="302.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">scontrol … DRAIN</text><line x1="380" y1="102" x2="424" y2="102" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="428" y="70" width="152" height="64" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="504.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">작업 종료 대기</text><text x="504.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">squeue -w 가 빌 때까지</text><line x1="582" y1="102" x2="626" y2="102" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="630" y="70" width="152" height="64" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="706.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">K8s 편입</text><text x="706.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">kubectl uncordon</text><line x1="784" y1="102" x2="828" y2="102" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="832" y="70" width="152" height="64" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="908.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">K8s 보유</text><text x="908.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">파드를 받는다</text><text x="24" y="172" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">되돌릴 때</text><text x="24" y="194" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">kubectl cordon 으로 새 파드를 막고, kubectl drain 으로 돌던 파드를 다른 노드로 옮긴 뒤,</text><text x="24" y="214" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">scontrol update NodeName=… State=RESUME 으로 Slurm에 돌려준다.</text><line x1="24" y1="238" x2="876" y2="238" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="262" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">세 번째 칸을 건너뛰면 돌던 학습이 통째로 죽는다. 24시간짜리 작업이 있을 수 있어 대기는 분이 아니라 시간 단위로 잡는다.</text><text x="24" y="282" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">자동화한다면 대기에 상한을 두고, 상한을 넘으면 사람에게 알리고 멈춘다. 강제로 끊는 자동화는 두지 않는다.</text></svg>