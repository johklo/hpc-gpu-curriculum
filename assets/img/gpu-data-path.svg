<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 280" role="img" aria-labelledby="t d"><title id="t">GPU 노드까지의 데이터 경로</title><desc id="d">공유 스토리지에서 노드 로컬 NVMe, 페이지 캐시, GPU 메모리로 갈수록 대역폭이 커진다. 첫 구간이 병목이므로 반복 읽기는 로컬에 캐시한다.</desc><rect width="830" height="280" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">GPU 노드까지 데이터가 오는 길</text><rect x="24" y="64" width="150" height="60" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="99.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">공유 스토리지</text><text x="99.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">Lustre / GPFS</text><rect x="232" y="64" width="150" height="60" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="307.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">노드 로컬 NVMe</text><text x="307.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">캐시</text><rect x="440" y="64" width="150" height="60" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="515.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">페이지 캐시</text><text x="515.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">호스트 메모리</text><rect x="648" y="64" width="150" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="723.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">GPU HBM</text><line x1="176" y1="94" x2="230" y2="94" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="178" y="86" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">IB 200G</text><line x1="384" y1="94" x2="438" y2="94" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="392" y="86" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">PCIe</text><line x1="592" y1="94" x2="646" y2="94" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="600" y="86" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">H2D</text><text x="99" y="146" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">수 GB/s</text><text x="99" y="162" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">노드당 공유 몫</text><text x="307" y="146" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">3~7 GB/s</text><text x="307" y="162" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">장치 한 대</text><text x="515" y="146" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">수십 GB/s</text><text x="515" y="162" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">DDR</text><text x="723" y="146" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">3 TB/s</text><text x="723" y="162" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">HBM3</text><line x1="24" y1="182" x2="798" y2="182" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="206" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">오른쪽으로 갈수록 빨라진다. 첫 구간이 가장 느리므로 같은 데이터를 반복해 읽는다면</text><text x="24" y="224" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">첫 에폭에만 공유 스토리지를 쓰고 이후에는 로컬 NVMe에서 읽는 편이 낫다.</text><path d="M 307 130 C 307 250, 99 250, 99 130" fill="none" stroke="#8A5600" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="203" y="262" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#8A5600">첫 에폭에 한 번만 내려받는다</text></svg>