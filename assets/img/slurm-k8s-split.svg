<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Slurm과 Kubernetes를 한 클러스터에서 함께 쓰는 구조</title><desc id="d">노드는 스케줄러마다 나눠 갖고, 파일시스템과 이미지와 신원과 네트워크와 지표는 함께 쓴다. 한 노드를 두 스케줄러가 동시에 관리하면 자원이 이중으로 할당된다.</desc><rect width="900" height="470" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Slurm과 Kubernetes를 한 클러스터에서 함께 쓰기</text><rect x="24" y="58" width="852" height="80" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="78" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">함께 쓰는 것 · 한 벌만 둔다</text><rect x="36" y="90" width="154" height="36" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="113.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">공유 파일시스템</text><text x="113.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">양쪽 같은 경로</text><rect x="202" y="90" width="154" height="36" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="279.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">이미지 레지스트리</text><text x="279.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">형식만 다르다</text><rect x="368" y="90" width="154" height="36" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="445.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">uid / gid 신원</text><text x="445.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">파일 권한의 기준</text><rect x="534" y="90" width="154" height="36" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="611.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">InfiniBand</text><text x="611.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">양쪽에서 RDMA</text><rect x="700" y="90" width="154" height="36" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="777.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">DCGM 지표</text><text x="777.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">한 벌로 다 본다</text><rect x="24" y="178" width="248" height="96" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="148.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Slurm 풀</text><text x="148.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">학습 · 배치 작업</text><text x="148.0" y="244.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">노드 48대</text><rect x="326" y="178" width="248" height="96" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="450.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">이동 가능 풀</text><text x="450.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">그때그때 넘긴다</text><text x="450.0" y="244.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">노드 8대</text><rect x="628" y="178" width="248" height="96" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="752.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Kubernetes 풀</text><text x="752.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">추론 · 개발 · CI</text><text x="752.0" y="244.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">노드 8대</text><line x1="320" y1="210" x2="278" y2="210" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="299" y="200" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">resume</text><line x1="278" y1="246" x2="320" y2="246" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="299" y="266" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">drain</text><line x1="580" y1="210" x2="622" y2="210" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="601" y="200" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">uncordon</text><line x1="622" y1="246" x2="580" y2="246" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="601" y="266" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">cordon</text><rect x="24" y="300" width="852" height="56" fill="#FBE9E6" stroke="#A5292B" stroke-width="1.5" rx="2"/><text x="40" y="322" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#A5292B">하지 말 것</text><text x="40" y="344" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">한 노드를 Slurm과 Kubernetes가 동시에 관리하는 구성. 서로의 할당을 모르므로 같은 GPU를 겹쳐 내주고 메모리가 터진다.</text><line x1="24" y1="382" x2="876" y2="382" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="406" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">노드는 반드시 한 스케줄러에만 속한다. 경계를 옮기는 일은 있어도 겹치는 구간은 없다.</text><text x="24" y="426" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">이동 가능 풀의 크기는 두 워크로드의 성수기가 얼마나 어긋나는지로 정한다. 겹친다면 정적으로 나누는 편이 낫다.</text><text x="24" y="446" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">파일 권한은 uid로 매겨지므로 Kubernetes 파드도 실제 사용자 uid로 실행해야 Slurm에서 만든 파일을 읽는다.</text></svg>