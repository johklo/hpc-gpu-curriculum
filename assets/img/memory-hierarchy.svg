<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">GPU가 값을 꺼내오는 곳과 그 비용</title><desc id="d">레지스터에서 멀어질수록 용량은 커지고 속도는 느려진다. 학습 성능 문제의 대부분은 값이 필요한 순간에 더 먼 칸에 있어서 생긴다.</desc><rect width="900" height="380" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">값이 어디에 있느냐가 속도를 정한다</text><rect x="24" y="60" width="240" height="30" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="36" y="75" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">레지스터</text><text x="252" y="75" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">SM 안</text><text x="676" y="75" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">수십 KB</text><text x="876" y="75" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">가장 빠르다</text><rect x="24" y="96" width="296" height="30" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="36" y="111" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">공유 메모리 · L1</text><text x="308" y="111" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">SM 안</text><text x="676" y="111" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">SM당 수백 KB</text><text x="876" y="111" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">수십 TB/s</text><rect x="24" y="132" width="352" height="30" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="147" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">L2 캐시</text><text x="364" y="147" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">GPU 안</text><text x="676" y="147" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">수십 MB</text><text x="876" y="147" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">수 TB/s</text><rect x="24" y="168" width="408" height="30" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="183" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">HBM</text><text x="420" y="183" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">GPU 보드 위</text><text x="676" y="183" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">80~192 GB</text><text x="876" y="183" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">3 TB/s</text><rect x="24" y="204" width="464" height="30" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="219" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">옆 GPU의 HBM</text><text x="476" y="219" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">NVLink 건너</text><text x="676" y="219" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">같은 노드 안</text><text x="876" y="219" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">900 GB/s</text><rect x="24" y="240" width="520" height="30" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="255" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">호스트 메모리</text><text x="532" y="255" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">PCIe 건너</text><text x="676" y="255" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">1~2 TB</text><text x="876" y="255" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">50 GB/s</text><rect x="24" y="276" width="576" height="30" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="291" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">다른 노드</text><text x="588" y="291" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">InfiniBand 건너</text><text x="676" y="291" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">클러스터 전체</text><text x="876" y="291" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">25 GB/s</text><rect x="24" y="312" width="632" height="30" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="36" y="327" text-anchor="start" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">공유 스토리지</text><text x="644" y="327" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">네트워크 끝</text><text x="676" y="327" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">PB 단위</text><text x="876" y="327" text-anchor="end" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">노드당 수 GB/s</text><line x1="24" y1="350" x2="876" y2="350" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="372" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">아래로 갈수록 넓고 느리다. 계산을 멈추게 하는 것은 대개 맨 아래 두 칸에서 값을 기다리는 시간이다.</text></svg>