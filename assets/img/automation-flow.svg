<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">노드 한 대를 클러스터에 넣기까지</title><desc id="d">새 노드는 정해진 순서로 준비된다. 각 단계마다 검증이 붙고, 검증에 실패하면 다음으로 넘기지 않고 멈춘다. 마지막에야 스케줄러가 작업을 보낸다.</desc><rect width="900" height="430" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">노드 한 대를 클러스터에 넣기까지</text><rect x="24" y="74" width="152" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="100.0" y="95.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">기본 설정</text><text x="100.0" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">커널 · 시간 · 계정</text><rect x="24" y="156" width="152" height="40" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="100.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">검증</text><line x1="100" y1="136" x2="100" y2="154" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><line x1="178" y1="104" x2="222" y2="104" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="226" y="74" width="152" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="302.0" y="95.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">마운트</text><text x="302.0" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">공유 파일시스템</text><rect x="226" y="156" width="152" height="40" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="302.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">검증</text><line x1="302" y1="136" x2="302" y2="154" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><line x1="380" y1="104" x2="424" y2="104" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="428" y="74" width="152" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="504.0" y="95.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">드라이버</text><text x="504.0" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">GPU · IB</text><rect x="428" y="156" width="152" height="40" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="504.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">검증</text><line x1="504" y1="136" x2="504" y2="154" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><line x1="582" y1="104" x2="626" y2="104" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="630" y="74" width="152" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="706.0" y="95.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">에이전트</text><text x="706.0" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">지표 · 로그 수집</text><rect x="630" y="156" width="152" height="40" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="706.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">검증</text><line x1="706" y1="136" x2="706" y2="154" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><line x1="784" y1="104" x2="828" y2="104" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><rect x="832" y="74" width="152" height="60" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="908.0" y="95.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">스케줄러 등록</text><text x="908.0" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">노드로 편입</text><rect x="832" y="156" width="152" height="40" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="908.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">검증</text><line x1="908" y1="136" x2="908" y2="154" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><path d="M 100 198 C 100 244, 802 244, 802 214" fill="none" stroke="#A5292B" stroke-width="1.8" stroke-dasharray="5 4"/><text x="450" y="268" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#A5292B">검증에 실패하면 다음 단계로 넘기지 않는다. 반쯤 준비된 노드가 대기열에 들어가는 것이 가장 나쁘다.</text><rect x="24" y="296" width="354" height="54" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="201.0" y="314.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">멱등성</text><text x="201.0" y="332.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">몇 번 돌려도 결과가 같다</text><rect x="400" y="296" width="354" height="54" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="577.0" y="314.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">검증 포함</text><text x="577.0" y="332.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">바꾼 뒤 확인까지 한 묶음이다</text><line x1="24" y1="374" x2="876" y2="374" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="396" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">손으로 한 번 고친 노드는 다음 배포에서 원래대로 돌아온다. 예외를 두려면 코드에 적어야 남는다.</text><text x="24" y="416" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">먼저 한 대에만 적용하고, 검증이 통과하면 몇 대씩 나눠 넓힌다. 전체에 한 번에 거는 배포는 두지 않는다.</text></svg>