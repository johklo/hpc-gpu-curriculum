<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 318" role="img" aria-labelledby="t d"><title id="t">Lustre 구조와 파일 접근 경로</title><desc id="d">클라이언트는 MDS에 파일 위치를 물은 뒤 OSS와 직접 데이터를 주고받는다. 데이터 경로가 MDS를 거치지 않아 대역폭이 OSS 수에 비례한다.</desc><rect width="700" height="318" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Lustre 구조와 파일 접근 경로</text><rect x="24" y="66" width="150" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="99.0" y="79.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">컴퓨트 노드 1</text><text x="99.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">Lustre 클라이언트</text><rect x="24" y="120" width="150" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="99.0" y="133.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">컴퓨트 노드 2</text><text x="99.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">Lustre 클라이언트</text><rect x="24" y="174" width="150" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="99.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-