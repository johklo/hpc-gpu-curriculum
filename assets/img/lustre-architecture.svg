246" fill="none" stroke="#006763" stroke-width="2" marker-end="url(#a)"/><text x="360" y="282" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">3. 읽기와 쓰기는 MDS를 거치지 않고 OSS와 직접 오간다</text><text x="24" y="300" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">메타데이터 경로는 점선, 데이터 경로는 실선이다. 대역폭은 OSS 수에 비례해 늘어난다.</text></svg>