<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">랭크와 파일과 OST의 대응</title><desc id="d">랭크마다 자기 샤드 파일을 하나씩 읽으면 파일이 OST 전체에 흩어져 부하가 고르다. 모든 랭크가 조각 수 1인 큰 파일 하나를 읽으면 서버 한 대로 몰린다.</desc><rect width="900" height="400" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">512개 랭크가 어느 OST에 붙는가</text><text x="24" y="62" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">좋은 배치 · 랭크마다 자기 파일</text><rect x="24" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="66.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 0</text><rect x="122" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="164.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 1</text><rect x="220" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="262.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 2</text><rect x="318" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="360.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 3</text><text x="430" y="100" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="13" font-weight="400" fill="#5F6D65">…</text><rect x="24" y="152" width="84" height="38" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="66.0" y="171.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">shard-0</text><line x1="66" y1="118" x2="66" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="122" y="152" width="84" height="38" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="164.0" y="171.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">shard-1</text><line x1="164" y1="118" x2="164" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="152" width="84" height="38" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="262.0" y="171.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">shard-2</text><line x1="262" y1="118" x2="262" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="318" y="152" width="84" height="38" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="360.0" y="171.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">shard-3</text><line x1="360" y1="118" x2="360" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><text x="430" y="174" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="13" font-weight="400" fill="#5F6D65">…</text><line x1="66" y1="192" x2="66" y2="214" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="164" y1="192" x2="164" y2="214" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="262" y1="192" x2="262" y2="214" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="360" y1="192" x2="360" y2="214" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="216" width="424" height="40" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="236" y="236" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#006763">OST 32대에 고르게 흩어진다</text><text x="24" y="288" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">조각 수는 1로 둔다. 파일이 이미 많아서</text><text x="24" y="306" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">파일 단위로 흩어진다.</text><line x1="472" y1="52" x2="472" y2="330" stroke="#D3D9D2" stroke-width="1"/><text x="500" y="62" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">위험한 배치 · 모두가 큰 파일 하나</text><rect x="500" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="542.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 0</text><rect x="598" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="640.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 1</text><rect x="696" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="738.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 2</text><rect x="794" y="78" width="84" height="38" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="836.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">랭크 3</text><line x1="542" y1="118" x2="542" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="640" y1="118" x2="640" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="738" y1="118" x2="738" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="836" y1="118" x2="836" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="500" y="152" width="378" height="38" fill="#FFFFFF" stroke="#A5292B" stroke-width="1.5" rx="2"/><text x="689.0" y="171.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">tokens.bin · 조각 수 1</text><line x1="689" y1="192" x2="689" y2="214" stroke="#A5292B" stroke-width="1.5" marker-end="url(#r)"/><rect x="640" y="216" width="98" height="40" fill="#FBE9E6" stroke="#A5292B" stroke-width="1.5" rx="2"/><text x="689" y="236" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#A5292B">OST 1대</text><text x="500" y="288" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">512개 랭크가 서버 한 대로 몰린다. 조각 수를</text><text x="500" y="306" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#38463E">넉넉히 주거나 파일을 나눈다.</text><line x1="24" y1="344" x2="876" y2="344" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="368" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">읽는 총량이 같아도 어느 서버에 떨어지느냐로 속도가 갈린다. lfs getstripe 로 실제 배치를 확인한다.</text></svg>