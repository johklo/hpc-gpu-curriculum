<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">LLM 학습 중 GPU 노드와 Lustre 사이를 오가는 트래픽</title><desc id="d">노드에서 스토리지로 가는 트래픽과 스토리지에서 노드로 오는 트래픽을 종류별로 방향과 양과 빈도로 나눠 표시했다. 매 스텝의 all-reduce는 컴퓨트 패브릭에서만 오가고 스토리지를 지나지 않는다.</desc><rect width="900" height="540" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">LLM 학습에서 노드와 Lustre 사이를 오가는 것</text><rect x="24" y="66" width="176" height="310" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="112.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">GPU 노드 64대</text><text x="112.0" y="194.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">GPU 512장</text><text x="112.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">한 대가 곧</text><text x="112.0" y="248.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">Lustre 클라이언트</text><text x="112.0" y="266.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">한 개다</text><rect x="700" y="66" width="176" height="310" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="788.0" y="176.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Lustre</text><text x="788.0" y="212.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">MDT · 파일 위치</text><text x="788.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">OST 32대 · 내용</text><text x="788.0" y="266.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">한계 20 GB/s</text><text x="216" y="98" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">① 학습을 시작할 때 한 번</text><text x="686" y="98" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#006763">980 GB</text><line x1="692" y1="110" x2="210" y2="110" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="216" y="132" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">체크포인트와 토크나이저를 읽는다</text><text x="216" y="154" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">② 매 스텝</text><text x="686" y="154" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#006763">1.6 MB/s</text><line x1="692" y1="166" x2="210" y2="166" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="216" y="188" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">토큰 샤드를 읽는다</text><text x="216" y="210" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">③ 30분마다</text><text x="686" y="210" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#8A5600">980 GB · 49초</text><line x1="210" y1="222" x2="692" y2="222" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="216" y="244" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">체크포인트를 쓴다</text><text x="216" y="266" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">④ 노드가 빠진 뒤</text><text x="686" y="266" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#006763">980 GB</text><line x1="692" y1="278" x2="210" y2="278" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="216" y="300" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">체크포인트를 되읽는다</text><text x="216" y="322" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">⑤ 학습 내내</text><text x="686" y="322" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#8A5600">양은 작고 open이 많다</text><line x1="210" y1="334" x2="692" y2="334" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="216" y="356" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">로그와 지표를 쓴다</text><line x1="24" y1="404" x2="876" y2="404" stroke="#D3D9D2" stroke-width="1"/><path d="M 62 380 C 40 444, 166 444, 144 380" fill="none" stroke="#38463E" stroke-width="2" marker-end="url(#b)"/><text x="216" y="428" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#38463E">매 스텝 노드 사이에서 기울기를 합친다</text><text x="216" y="448" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">all-reduce · 스텝당 280 GB · 컴퓨트 패브릭</text><text x="686" y="434" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#38463E">스토리지로 가지 않는다</text><line x1="24" y1="470" x2="876" y2="470" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="494" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">읽기는 왼쪽 방향, 쓰기는 오른쪽 방향이다. 스토리지로 가는 양은 거의 전부가 ①③④의 체크포인트다.</text><text x="24" y="514" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">②의 토큰 읽기는 클러스터 전체를 합쳐도 초당 수 MB라 같은 축에 그리면 보이지 않는다.</text></svg>