<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="t d"><title id="t">체크포인트와 재개</title><desc id="d">주기적으로 체크포인트를 남기면 노드 장애 시 마지막 지점부터 다시 시작할 수 있고, 잃는 계산은 장애와 직전 체크포인트 사이 구간이다.</desc><rect width="640" height="285" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker></defs><text x="24" y="30" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">체크포인트와 재개</text><line x1="40" y1="150" x2="600" y2="150" stroke="#38463E" stroke-width="1.5"/><line x1="40" y1="146" x2="40" y2="154" stroke="#5F6D65" stroke-width="1"/><line x1="152" y1="146" x2="152" y2="154" stroke="#5F6D65" stroke-width="1"/><line x1="264" y1="146" x2="264" y2="154" stroke="#5F6D65" stroke-width="1"/><line x1="376" y1="146" x2="376" y2="154" stroke="#5F6D65" stroke-width="1"/><line x1="488" y1="146" x2="488" y2="154" stroke="#5F6D65" stroke-width="1"/><line x1="600" y1="146" x2="600" y2="154" stroke="#5F6D65" stroke-width="1"/><circle cx="96" cy="150" r="7" fill="#196632"/><text x="96" y="132" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#196632">ckpt 1</text><circle cx="208" cy="150" r="7" fill="#196632"/><text x="208" y="132" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#196632">ckpt 2</text><circle cx="320" cy="150" r="7" fill="#196632"/><text x="320" y="132" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#196632">ckpt 3</text><line x1="432" y1="118" x2="432" y2="182" stroke="#9D3533" stroke-width="2.5"/><text x="432" y="110" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#9D3533">노드 장애</text><path d="M 432 176 Q 380 205 324 176" fill="none" stroke="#006763" stroke-width="2" marker-end="url(#a)"/><text x="378" y="205" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">마지막 체크포인트에서 재개한다</text><rect x="320" y="60" width="112" height="26" fill="#E2E7E1" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="376" y="77" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#8A5600">잃는 계산</text><text x="24" y="248" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">저장 간격은 한 번 저장하는 데 걸리는 시간의 20배에서 50배 사이에서 잡는다.</text><text x="24" y="266" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">간격이 짧으면 I/O가 학습을 방해하고, 길면 사고 때 잃는 계산이 커진다.</text></svg>