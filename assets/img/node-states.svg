<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d"><title id="t">노드 상태와 그 사이를 오가는 명령</title><desc id="d">작업이 들어오면 할당 상태가 되고 끝나면 유휴로 돌아온다. 점검하려면 드레인을 걸어 새 작업을 막고 돌던 작업이 끝나기를 기다린다. 응답이 없으면 다운으로 떨어진다.</desc><rect width="900" height="410" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">노드 상태와 그 사이를 오가는 명령</text><rect x="24" y="92" width="150" height="58" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="99.0" y="112.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">IDLE</text><text x="99.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">자원이 비어 있다</text><rect x="250" y="92" width="150" height="58" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="325.0" y="112.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">ALLOCATED / MIXED</text><text x="325.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">일부 또는 전부 사용 중</text><rect x="476" y="92" width="150" height="58" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="551.0" y="112.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">DRAINING</text><text x="551.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">새 작업을 안 받고 기다린다</text><rect x="702" y="92" width="150" height="58" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="777.0" y="112.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">DRAINED</text><text x="777.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">완전히 비었다</text><line x1="176" y1="121" x2="246" y2="121" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><text x="211" y="112" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">작업 배정</text><line x1="402" y1="121" x2="472" y2="121" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="437" y="112" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">State=DRAIN</text><line x1="628" y1="121" x2="698" y2="121" stroke="#8A5600" stroke-width="1.8" marker-end="url(#w)"/><text x="663" y="112" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#8A5600">작업 종료</text><path d="M 250 90 C 250 52, 176 52, 176 90" fill="none" stroke="#38463E" stroke-width="1.8" marker-end="url(#b)"/><text x="213" y="46" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">작업이 끝난다</text><path d="M 777 152 C 777 228, 99 228, 99 152" fill="none" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="438" y="252" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">State=RESUME · 점검이 끝나면 되돌린다</text><rect x="250" y="282" width="150" height="54" fill="#FBE9E6" stroke="#A5292B" stroke-width="1.5" rx="2"/><text x="325.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">DOWN / FAIL</text><text x="325.0" y="318.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">응답이 없다</text><line x1="325" y1="152" x2="325" y2="280" stroke="#A5292B" stroke-width="1.5" marker-end="url(#r)"/><text x="334" y="178" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#A5292B">응답 없음 · 그 위의 작업은 죽는다</text><line x1="24" y1="356" x2="876" y2="356" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="378" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">DRAIN 은 새 작업만 막고 돌던 작업은 끝까지 둔다. 즉시 비우는 명령이 아니라 기다림을 포함한다.</text><text x="24" y="398" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">sinfo -R 로 드레인 사유를 확인한다. 사유를 적어 두지 않으면 왜 뺐는지 아무도 모르게 된다.</text></svg>