<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 315" role="img" aria-labelledby="t d"><title id="t">Xid 분류 흐름</title><desc id="d">Xid가 특정 노드에서 반복되면 하드웨어를 의심하고, 사용자 코드와 함께만 나면 애플리케이션을 본다.</desc><rect width="620" height="315" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker></defs><text x="24" y="30" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">Xid 발생 시 판단 순서</text><rect x="24" y="54" width="200" height="50" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="124.0" y="79.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">dmesg에 Xid 확인</text><rect x="24" y="132" width="200" height="56" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="124.0" y="153.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">같은 노드에서</text><text x="124.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" fill="#5F6D65">반복되는가</text><rect x="280" y="132" width="150" height="56" fill="#E2E7E1" stroke="#9D3533" stroke-width="1.5" rx="2"/><text x="355.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#9D3533">예</text><rect x="280" y="210" width="150" height="56" fill="#E2E7E1" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="355.0" y="238.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#8A5600">아니오</text><rect x="456" y="132" width="150" height="56" fill="#FFFFFF" stroke="#9D3533" stroke-width="1.5" rx="2"/><text x="531.0" y="153.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">노드 드레인</text><text x="531.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" fill="#5F6D65">dcgmi diag -r 3</text><rect x="456" y="210" width="150" height="56" fill="#FFFFFF" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="531.0" y="231.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">사용자 코드</text><text x="531.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" fill="#5F6D65">메모리 접근 확인</text><line x1="124" y1="104" x2="124" y2="130" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><line x1="224" y1="155" x2="278" y2="155" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><line x1="224" y1="172" x2="278" y2="225" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><line x1="430" y1="160" x2="454" y2="160" stroke="#9D3533" stroke-width="1.8" marker-end="url(#a)"/><line x1="430" y1="238" x2="454" y2="238" stroke="#8A5600" stroke-width="1.8" marker-end="url(#a)"/><text x="24" y="296" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">48 / 63 / 74 / 79 는 하드웨어 쪽, 13 / 31 / 43 은 애플리케이션 쪽일 때가 많다</text></svg>