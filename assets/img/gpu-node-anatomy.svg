<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">GPU 노드 한 대의 물리 구성</title><desc id="d">소켓 두 개에 각각 메모리와 PCIe 스위치가 붙고, 스위치 아래에 GPU 네 장과 네트워크 카드가 달린다. GPU끼리는 NVSwitch로 따로 이어진다. 소켓을 넘는 경로가 가장 느리다.</desc><rect width="900" height="500" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">GPU 노드 한 대 안에서 무엇이 어디에 붙어 있는가</text><rect x="24" y="62" width="58" height="46" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="53.0" y="76.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">DDR</text><text x="53.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">메모리</text><rect x="818" y="62" width="58" height="46" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="847.0" y="76.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">DDR</text><text x="847.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">메모리</text><rect x="96" y="62" width="292" height="46" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="242.0" y="76.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">CPU 소켓 0</text><text x="242.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">NUMA 노드 0</text><rect x="512" y="62" width="292" height="46" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="658.0" y="76.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">CPU 소켓 1</text><text x="658.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">NUMA 노드 1</text><line x1="84" y1="85" x2="94" y2="85" stroke="#38463E" stroke-width="1.5" marker-end="url(#b)"/><line x1="816" y1="85" x2="806" y2="85" stroke="#38463E" stroke-width="1.5" marker-end="url(#b)"/><line x1="390" y1="85" x2="510" y2="85" stroke="#A5292B" stroke-width="2" marker-end="url(#r)"/><text x="450" y="76" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#A5292B">UPI · 소켓을 넘는 가장 느린 구간</text><rect x="96" y="152" width="292" height="40" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="242.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">PCIe 스위치</text><rect x="512" y="152" width="292" height="40" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="658.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">PCIe 스위치</text><line x1="242" y1="110" x2="242" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><text x="250" y="132" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">PCIe Gen5 x16 · 64 GB/s</text><line x1="658" y1="110" x2="658" y2="150" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><text x="666" y="132" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">PCIe Gen5 x16 · 64 GB/s</text><rect x="24" y="152" width="58" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="53.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">HCA</text><rect x="818" y="152" width="58" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="847.0" y="172.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">HCA</text><line x1="84" y1="172" x2="94" y2="172" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="816" y1="172" x2="806" y2="172" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="96" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="129.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 0</text><text x="129.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="129" y1="194" x2="129" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="129" y1="292" x2="129" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="174" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="207.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 1</text><text x="207.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="207" y1="194" x2="207" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="207" y1="292" x2="207" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="252" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="285.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 2</text><text x="285.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="285" y1="194" x2="285" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="285" y1="292" x2="285" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="363.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 3</text><text x="363.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="363" y1="194" x2="363" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="363" y1="292" x2="363" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="512" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="545.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 4</text><text x="545.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="545" y1="194" x2="545" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="545" y1="292" x2="545" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="590" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="623.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 5</text><text x="623.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="623" y1="194" x2="623" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="623" y1="292" x2="623" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="668" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="701.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 6</text><text x="701.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="701" y1="194" x2="701" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="701" y1="292" x2="701" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="746" y="238" width="66" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="779.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">GPU 7</text><text x="779.0" y="273.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">HBM</text><line x1="779" y1="194" x2="779" y2="236" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="779" y1="292" x2="779" y2="330" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="96" y="332" width="708" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="450.0" y="352.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#0D1C14">NVSwitch · GPU 사이 900 GB/s · 어느 짝이든 같은 대역</text><line x1="24" y1="400" x2="876" y2="400" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="424" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">학습 프로세스는 자기 GPU와 같은 소켓에 붙은 메모리를 써야 한다. 소켓을 넘으면 붉은 구간을 지나 지연이 늘고 대역폭이 준다.</text><text x="24" y="444" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">GPUDirect RDMA는 HCA와 GPU가 같은 PCIe 스위치 아래 있을 때 효과가 크다. 짝이 어긋나면 데이터가 소켓을 건너 돌아간다.</text><text x="24" y="464" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">nvidia-smi topo -m 의 PIX 는 같은 스위치, NODE 는 같은 소켓, SYS 는 소켓을 넘는 경로를 뜻한다.</text></svg>