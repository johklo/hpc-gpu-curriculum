<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="t d"><title id="t">지표와 로그가 흘러가는 길</title><desc id="d">노드와 GPU와 스케줄러에서 나온 지표는 수집기를 거쳐 시계열 저장소로, 로그는 별도 경로로 모인다. 화면과 알림은 같은 저장소를 본다.</desc><rect width="900" height="490" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">지표와 로그가 흘러가는 길</text><rect x="24" y="68" width="200" height="50" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="124.0" y="84.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">노드</text><text x="124.0" y="102.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">node_exporter</text><text x="232" y="84" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">CPU · 메모리 · 디스크</text><line x1="226" y1="93" x2="396" y2="93" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="126" width="200" height="50" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="124.0" y="142.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU</text><text x="124.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">dcgm-exporter</text><text x="232" y="142" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">사용률 · 온도 · XID</text><line x1="226" y1="151" x2="396" y2="151" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="184" width="200" height="50" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="124.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">스케줄러</text><text x="124.0" y="218.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">slurm-exporter</text><text x="232" y="200" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">대기 · 할당 · 노드 상태</text><line x1="226" y1="209" x2="396" y2="209" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="242" width="200" height="50" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="124.0" y="258.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">작업</text><text x="124.0" y="276.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">학습 코드</text><text x="232" y="258" text-anchor="start" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">스텝 시간 · 로더 대기</text><line x1="226" y1="267" x2="396" y2="267" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="68" width="180" height="214" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="490.0" y="148.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">Prometheus</text><text x="490.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">긁어서 모은다</text><text x="490.0" y="202.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">보존 기간을 정한다</text><rect x="24" y="306" width="344" height="68" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="196.0" y="331.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">로그</text><text x="196.0" y="349.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">promtail · slurmctld · dmesg · 작업 출력</text><rect x="400" y="306" width="180" height="68" fill="#EDF1ED" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="490.0" y="331.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">Loki</text><text x="490.0" y="349.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">같은 라벨을 붙인다</text><line x1="370" y1="340" x2="396" y2="340" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="68" width="236" height="88" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="758.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">대시보드</text><text x="758.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">보는 사람마다 다른 화면</text><rect x="640" y="178" width="236" height="88" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="758.0" y="213.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">알림</text><text x="758.0" y="231.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">정상 범위를 벗어날 때만</text><rect x="640" y="306" width="236" height="68" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="758.0" y="331.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">장애 리포트</text><text x="758.0" y="349.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">그래프와 로그를 근거로</text><line x1="584" y1="112" x2="636" y2="112" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="584" y1="208" x2="636" y2="208" stroke="#8A5600" stroke-width="1.5" marker-end="url(#w)"/><line x1="584" y1="340" x2="636" y2="340" stroke="#006763" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="400" x2="876" y2="400" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="422" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">지표는 무엇이 언제 이상했는지 알려주고, 로그는 그 순간의 이유를 준다. 둘을 작업 번호로 이어야 오갈 수 있다.</text><text x="24" y="444" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">라벨을 잘게 쪼갤수록 시계열 개수가 곱으로 늘어난다. 저장 비용이 터지는 원인은 대개 수집 대상이 아니라 라벨이다.</text><text x="24" y="466" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">알림은 사람이 지금 손댈 수 있는 것에만 건다. 손댈 수 없는 알림은 무시하는 습관을 만든다.</text></svg>