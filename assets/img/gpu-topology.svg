<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d"><title id="t">노드 안의 GPU 연결 형태</title><desc id="d">GPU 쌍은 NVLink로 직결되고, 다른 그룹으로 가려면 PCIe 스위치나 소켓 경계를 거친다.</desc><rect width="560" height="300" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker></defs><text x="24" y="30" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">노드 안의 GPU 연결 형태</text><rect x="70" y="80" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="108" y="111" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU0</text><rect x="190" y="80" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="228" y="111" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU1</text><rect x="310" y="80" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="348" y="111" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU2</text><rect x="430" y="80" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="468" y="111" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU3</text><rect x="70" y="190" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="108" y="221" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU4</text><rect x="190" y="190" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="228" y="221" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU5</text><rect x="310" y="190" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="348" y="221" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU6</text><rect x="430" y="190" width="76" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="468" y="221" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">GPU7</text><line x1="146" y1="106" x2="190" y2="106" stroke="#006763" stroke-width="3"/><text x="168.0" y="98" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">NV</text><line x1="386" y1="106" x2="430" y2="106" stroke="#006763" stroke-width="3"/><text x="408.0" y="98" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">NV</text><line x1="146" y1="216" x2="190" y2="216" stroke="#006763" stroke-width="3"/><text x="168.0" y="208" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">NV</text><line x1="386" y1="216" x2="430" y2="216" stroke="#006763" stroke-width="3"/><text x="408.0" y="208" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">NV</text><line x1="108" y1="132" x2="108" y2="190" stroke="#5F6D65" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="468" y1="132" x2="468" y2="190" stroke="#5F6D65" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="108" y1="161" x2="468" y2="161" stroke="#5F6D65" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="238" y="146" width="100" height="30" fill="#FFFFFF" stroke="#5F6D65" stroke-width="1.5" rx="2"/><text x="288" y="166" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">PCIe / SYS</text><text x="24" y="268" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">굵은 선은 NVLink 직결이고 점선은 스위치나 소켓을 거치는 경로다.</text><text x="24" y="286" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">4장을 쓰는 작업에는 NVLink로 묶인 조합을 주는 편이 통신에서 유리하다.</text></svg>