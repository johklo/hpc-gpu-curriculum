<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 304" role="img" aria-labelledby="t d"><title id="t">모니터링 스택</title><desc id="d">노드의 수집기가 지표를 내보내면 시계열 DB가 저장하고, 대시보드와 경보, 장기 보관으로 나뉘어 쓰인다.</desc><rect width="730" height="304" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9D3533"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">지표가 흐르는 길</text><rect x="24" y="58" width="196" height="180" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="36" y="80" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#38463E">컴퓨트 노드</text><rect x="36" y="92" width="172" height="40" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="122.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">node exporter</text><text x="122.0" y="122.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">CPU · 메모리 · 디스크</text><rect x="36" y="140" width="172" height="40" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="122.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">DCGM exporter</text><text x="122.0" y="170.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">GPU · 온도 · Xid</text><rect x="36" y="188" width="172" height="40" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="122.0" y="202.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">slurm exporter</text><text x="122.0" y="218.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">대기열 · 할당</text><rect x="292" y="110" width="170" height="70" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="377.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">시계열 DB</text><text x="377.0" y="155.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">Prometheus 계열</text><rect x="534" y="58" width="170" height="56" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="619.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">대시보드</text><text x="619.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">Grafana</text><rect x="534" y="132" width="170" height="56" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="619.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">경보</text><text x="619.0" y="170.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">즉시 조치할 것만</text><rect x="534" y="206" width="170" height="56" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="619.0" y="228.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">장기 보관</text><text x="619.0" y="244.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">용량 계획 · 추세</text><line x1="220" y1="145" x2="290" y2="145" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="226" y="136" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">수집</text><line x1="464" y1="145" x2="532" y2="86" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><line x1="464" y1="145" x2="532" y2="160" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><line x1="464" y1="145" x2="532" y2="234" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="24" y="286" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">수집은 한 번 하고 집계를 여러 갈래로 둔다. 경보는 사람이 즉시 움직일 것만 남긴다.</text></svg>