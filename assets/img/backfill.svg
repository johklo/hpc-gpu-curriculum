<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-labelledby="t d"><title id="t">백필 스케줄링</title><desc id="d">대기 중인 큰 작업이 시작하기 전 빈 구간에 짧은 작업을 배치해 유휴를 줄인다.</desc><rect width="620" height="240" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker></defs><text x="24" y="30" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">백필이 채우는 빈틈</text><text x="24" y="56" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">시간</text><line x1="24" y1="200" x2="596" y2="200" stroke="#38463E" stroke-width="1.5"/><line x1="90" y1="196" x2="90" y2="204" stroke="#5F6D65" stroke-width="1"/><text x="90" y="220" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">t+0h</text><line x1="200" y1="196" x2="200" y2="204" stroke="#5F6D65" stroke-width="1"/><text x="200" y="220" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">t+2h</text><line x1="310" y1="196" x2="310" y2="204" stroke="#5F6D65" stroke-width="1"/><text x="310" y="220" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">t+4h</text><line x1="420" y1="196" x2="420" y2="204" stroke="#5F6D65" stroke-width="1"/><text x="420" y="220" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">t+6h</text><line x1="530" y1="196" x2="530" y2="204" stroke="#5F6D65" stroke-width="1"/><text x="530" y="220" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">t+8h</text><rect x="30" y="70" width="170" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="115" y="100" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">실행 중 작업 A</text><rect x="310" y="70" width="280" height="52" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="450" y="100" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">대기 중 작업 B (노드 8대 필요)</text><rect x="200" y="70" width="110" height="52" fill="none" stroke="#5F6D65" stroke-width="1.5" stroke-dasharray="5 4" rx="2"/><text x="255" y="100" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="400" fill="#5F6D65">빈틈</text><rect x="200" y="134" width="106" height="44" fill="#E2E7E1" stroke="#196632" stroke-width="1.8" rx="2"/><text x="253" y="158" text-anchor="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#196632">작업 C</text><line x1="253" y1="130" x2="253" y2="124" stroke="#196632" stroke-width="1.8" marker-end="url(#a)"/><text x="320" y="158" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="400" fill="#38463E">B 시작 전에 끝나는 짧은 작업을 먼저 넣는다</text></svg>