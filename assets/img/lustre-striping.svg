<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 268" role="img" aria-labelledby="t d"><title id="t">Lustre 스트라이핑</title><desc id="d">파일을 stripe_size 단위로 잘라 stripe_count 개의 OST에 번갈아 저장하고, 읽을 때 여러 OST에서 동시에 가져온다.</desc><rect width="660" height="268" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">스트라이핑: 파일 하나를 여러 OST에 나눈다</text><text x="24" y="58" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">train.bin  (4 GB)</text><rect x="24" y="70" width="96" height="34" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="72.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">0-4M</text><rect x="128" y="70" width="96" height="34" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="176.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">4-8M</text><rect x="232" y="70" width="96" height="34" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="280.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">8-12M</text><rect x="336" y="70" width="96" height="34" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="384.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">12-16M</text><rect x="440" y="70" width="96" height="34" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="488.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">16-20M</text><rect x="544" y="70" width="96" height="34" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="592.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="11" font-weight="600" fill="#0D1C14">20-24M</text><text x="24" y="122" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">stripe_size = 4M · stripe_count = 3</text><rect x="24" y="150" width="196" height="52" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="122.0" y="169.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">OST 0</text><text x="122.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">조각 0, 3</text><rect x="240" y="150" width="196" height="52" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="338.0" y="169.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">OST 1</text><text x="338.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">조각 1, 4</text><rect x="456" y="150" width="196" height="52" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="554.0" y="169.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">OST 2</text><text x="554.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" fill="#5F6D65">조각 2, 5</text><path d="M 72 106 C 72 130, 122 126, 122 148" fill="none" stroke="#006763" stroke-width="1.4" marker-end="url(#a)"/><path d="M 176 106 C 176 130, 338 126, 338 148" fill="none" stroke="#5F6D65" stroke-width="1.4" marker-end="url(#b)"/><path d="M 280 106 C 280 130, 554 126, 554 148" fill="none" stroke="#5F6D65" stroke-width="1.4" marker-end="url(#b)"/><path d="M 384 106 C 384 130, 122 126, 122 148" fill="none" stroke="#006763" stroke-width="1.4" marker-end="url(#a)"/><path d="M 488 106 C 488 130, 338 126, 338 148" fill="none" stroke="#5F6D65" stroke-width="1.4" marker-end="url(#b)"/><path d="M 592 106 C 592 130, 554 126, 554 148" fill="none" stroke="#5F6D65" stroke-width="1.4" marker-end="url(#b)"/><text x="24" y="232" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">세 OST에서 동시에 읽으므로 한 대에서 읽을 때보다 대역폭이 세 배가 된다.</text><text x="24" y="250" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">작은 파일에 조각을 늘리면 접속만 늘고 이득이 없다. 조각당 크기가 충분해야 한다.</text></svg>