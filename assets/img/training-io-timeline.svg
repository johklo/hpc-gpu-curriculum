<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">학습 시간축에서 본 스토리지 부하</title><desc id="d">토큰 읽기는 축척으로 보이지 않을 만큼 작고 일정하다. 체크포인트 쓰기만 주기적으로 상한까지 치솟으며 그동안 계산이 멈춘다. 노드가 빠지면 되읽기가 한 번 더 일어난다.</desc><rect width="900" height="360" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">시간축에서 본 스토리지 부하</text><line x1="96" y1="268" x2="856" y2="268" stroke="#38463E" stroke-width="1.5"/><line x1="96" y1="268" x2="96" y2="84" stroke="#38463E" stroke-width="1.5"/><text x="86" y="92" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">20 GB/s</text><text x="86" y="108" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="9" font-weight="400" fill="#5F6D65">스토리지 상한</text><text x="86" y="272" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">0</text><line x1="96" y1="96" x2="856" y2="96" stroke="#D3D9D2" stroke-width="1" stroke-dasharray="4 4"/><text x="412" y="62" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="600" fill="#8A5600">체크포인트 쓰기 · 980 GB · 49초 · 그동안 GPU 512장이 논다</text><rect x="124" y="96" width="20" height="172" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5"/><text x="134" y="82" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">시작 시 읽기</text><rect x="268" y="96" width="20" height="172" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5"/><rect x="412" y="96" width="20" height="172" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5"/><rect x="556" y="96" width="20" height="172" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5"/><rect x="700" y="96" width="20" height="172" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5"/><rect x="800" y="96" width="20" height="172" fill="#FBE9E6" stroke="#A5292B" stroke-width="1.5"/><text x="812" y="82" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#A5292B">노드 교체 후 되읽기</text><line x1="96" y1="266" x2="856" y2="266" stroke="#006763" stroke-width="2.5"/><text x="104" y="290" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#006763">토큰 읽기 1.6 MB/s · 이 축척에서는 바닥에 붙는다</text><text x="134" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">0분</text><text x="278" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">30분</text><text x="422" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">60분</text><text x="566" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">90분</text><text x="710" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">120분</text><text x="820" y="310" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">장애</text><line x1="24" y1="310" x2="876" y2="310" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="334" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">학습 내내 읽기는 바닥에 깔리고, 스토리지가 바빠지는 순간은 저장할 때뿐이다. 용량이 아니라 이 봉우리에 맞춰 대역폭을 잡는다.</text></svg>