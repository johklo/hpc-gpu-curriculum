<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" role="img" aria-labelledby="t d"><title id="t">HPC 클러스터 구성과 작업 실행 경로</title><desc id="d">로그인 노드에서 제출한 작업을 스케줄러가 컴퓨트 노드에 배치하고, 컴퓨트 노드는 인터커넥트로 서로 통신하며 공유 스토리지에서 데이터를 읽고 결과를 쓴다.</desc><rect width="660" height="310" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker></defs><text x="24" y="30" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">클러스터 구성과 작업 실행 경로</text><rect x="24" y="56" width="150" height="62" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="99.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">로그인 노드</text><text x="99.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" fill="#5F6D65">ssh 접속</text><rect x="238" y="56" width="150" height="62" fill="#FFFFFF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="313.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">스케줄러</text><text x="313.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" fill="#5F6D65">slurmctld</text><rect x="452" y="56" width="172" height="62" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="538.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="14" font-weight="600" fill="#0D1C14">컴퓨트 노드</text><text x="538.0" y="99.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' fon