<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">GPU 한 시간의 원가 구성</title><desc id="d">장비 감가가 절반을 넘지만 전력과 냉각과 운영이 나머지를 채운다. 가동률이 떨어지면 같은 비용을 더 적은 시간으로 나누게 되어 실사용 단가가 오른다.</desc><rect width="900" height="400" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A5600"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5292B"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">GPU 한 시간의 원가는 어디로 가는가</text><rect x="24" y="72" width="573" height="46" fill="#FFFFFF" stroke="#006763" stroke-width="1.5"/><text x="310.5" y="95" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">장비 감가</text><rect x="597" y="72" width="80" height="46" fill="#FFFFFF" stroke="#8A5600" stroke-width="1.5"/><text x="637.0" y="95" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#0D1C14">전력</text><rect x="677" y="72" width="61" height="46" fill="#FFFFFF" stroke="#38463E" stroke-width="1.5"/><rect x="738" y="72" width="46" height="46" fill="#FFFFFF" stroke="#38463E" stroke-width="1.5"/><rect x="784" y="72" width="38" height="46" fill="#FFFFFF" stroke="#38463E" stroke-width="1.5"/><rect x="822" y="72" width="31" height="46" fill="#FFFFFF" stroke="#8A5600" stroke-width="1.5"/><rect x="853" y="72" width="23" height="46" fill="#FFFFFF" stroke="#38463E" stroke-width="1.5"/><text x="24" y="150" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">장비 감가</text><text x="300" y="150" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#006763">연 7,500만 원</text><text x="400" y="150" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65">67.3%</text><text x="24" y="172" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">전력</text><text x="300" y="172" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#8A5600">연 1,050만 원</text><text x="400" y="172" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 9.4%</text><text x="24" y="194" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">운영 인력</text><text x="300" y="194" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">연 800만 원</text><text x="400" y="194" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 7.2%</text><text x="24" y="216" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">스토리지</text><text x="300" y="216" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">연 600만 원</text><text x="400" y="216" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 5.4%</text><text x="24" y="238" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">네트워크</text><text x="300" y="238" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">연 500만 원</text><text x="400" y="238" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 4.5%</text><text x="24" y="260" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">냉각</text><text x="300" y="260" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#8A5600">연 400만 원</text><text x="400" y="260" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 3.6%</text><text x="24" y="282" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">상면</text><text x="300" y="282" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">연 300만 원</text><text x="400" y="282" text-anchor="end" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#5F6D65"> 2.7%</text><rect x="470" y="146" width="406" height="158" fill="#F7EEE0" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="673.0" y="180.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">가동률이 단가를 정한다</text><text x="673.0" y="216.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">가동률 40%  ·  시간당 3,980원</text><text x="673.0" y="234.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">가동률 60%  ·  시간당 2,650원</text><text x="673.0" y="252.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">가동률 80%  ·  시간당 1,990원</text><text x="673.0" y="270.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">가동률 95%  ·  시간당 1,670원</text><line x1="24" y1="330" x2="876" y2="330" stroke="#D3D9D2" stroke-width="1"/><text x="24" y="352" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">가동률을 60%에서 80%로 올리면 GPU를 25% 더 사는 것과 같은 효과가 난다. 장비를 늘리기 전에 활용률부터 본다.</text><text x="24" y="372" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">전력과 냉각을 합치면 감가 다음으로 크다. 랙 전력이 상한인 곳에서는 이 항목이 증설 가능 여부까지 정한다.</text></svg>