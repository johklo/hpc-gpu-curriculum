<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" role="img" aria-labelledby="t d"><title id="t">작업 상태 전이</title><desc id="d">작업은 대기에서 실행으로 가고 정상 종료, 실패, 시간 초과, 노드 장애 중 하나로 끝난다. 재제출이 걸려 있으면 대기열로 돌아간다.</desc><rect width="660" height="344" fill="#EDF1ED"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006763"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9D3533"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6D65"/></marker></defs><text x="24" y="28" text-anchor="start" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="13" font-weight="600" fill="#0D1C14">작업의 상태 전이</text><rect x="24" y="70" width="140" height="50" fill="#FFFFFF" stroke="#D3D9D2" stroke-width="1.5" rx="2"/><text x="94.0" y="89.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">PENDING</text><text x="94.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">대기열</text><rect x="236" y="70" width="140" height="50" fill="#D6F2EF" stroke="#006763" stroke-width="1.5" rx="2"/><text x="306.0" y="89.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">RUNNING</text><text x="306.0" y="105.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">실행 중</text><rect x="462" y="20" width="150" height="44" fill="#FFFFFF" stroke="#196632" stroke-width="1.5" rx="2"/><text x="537.0" y="36.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">COMPLETED</text><text x="537.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">exit 0</text><rect x="462" y="78" width="150" height="44" fill="#FFFFFF" stroke="#9D3533" stroke-width="1.5" rx="2"/><text x="537.0" y="94.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">FAILED</text><text x="537.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">exit != 0</text><rect x="462" y="136" width="150" height="44" fill="#FFFFFF" stroke="#8A5600" stroke-width="1.5" rx="2"/><text x="537.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">TIMEOUT</text><text x="537.0" y="168.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">시간 초과</text><rect x="462" y="194" width="150" height="44" fill="#FFFFFF" stroke="#9D3533" stroke-width="1.5" rx="2"/><text x="537.0" y="210.0" text-anchor="middle" dominant-baseline="middle" font-family='IBM Plex Sans, Segoe UI, Helvetica, sans-serif' font-size="12" font-weight="600" fill="#0D1C14">NODE_FAIL</text><text x="537.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="9.5" fill="#5F6D65">노드 장애</text><line x1="166" y1="95" x2="234" y2="95" stroke="#006763" stroke-width="1.8" marker-end="url(#a)"/><text x="172" y="86" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="10" font-weight="400" fill="#5F6D65">자원 확보</text><path d="M 378 95 C 420 95, 420 44, 460 44" fill="none" stroke="#006763" stroke-width="1.6" marker-end="url(#a)"/><path d="M 378 95 C 420 95, 420 100, 460 100" fill="none" stroke="#9D3533" stroke-width="1.6" marker-end="url(#r)"/><path d="M 378 95 C 420 95, 420 158, 460 158" fill="none" stroke="#5F6D65" stroke-width="1.6" marker-end="url(#m)"/><path d="M 378 95 C 420 95, 420 216, 460 216" fill="none" stroke="#9D3533" stroke-width="1.6" marker-end="url(#r)"/><path d="M 537 238 C 537 280, 94 280, 94 122" fill="none" stroke="#8A5600" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="300" y="296" text-anchor="middle" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#8A5600">--requeue 가 걸려 있으면 다시 대기열로 들어간다</text><text x="24" y="326" text-anchor="start" font-family='JetBrains Mono, Consolas, monospace' font-size="11" font-weight="400" fill="#38463E">squeue 의 REASON 열이 PENDING 에 머무는 이유를 알려준다. sacct 로 끝난 뒤 상태를 본다.</text></svg>